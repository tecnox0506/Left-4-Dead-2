<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personajes - Selección</title>
    <style>
        /* CONFIGURACIÓN GENERAL */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            color: white;
            background-image: url('img/2.png'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* NAVEGACIÓN */
        nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex; 
            background-color: rgba(255, 0, 0, 0.9);
            align-items: center;
        }

        nav li a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 15px 20px;
            font-weight: bold;
        }

        nav li a:hover {
            background-color: yellow;
            color: black;
        }

        .nav-logo-right {
            margin-left: auto;
            padding: 10px 20px;
        }

        .nav-logo-right img {
            height: 40px;
        }

        /* CONTENEDOR PRINCIPAL CENTRADO */
        .main-container {
            flex: 1;
            display: flex;
            justify-content: center; /* Centra horizontalmente */
            align-items: center;     /* Centra verticalmente */
            padding: 40px 20px;
        }

        /* CUADRÍCULA DE PERSONAJES */
        .image-grid {
            display: grid;
            /* Crea 4 columnas automáticas en PC */
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 30px;
            max-width: 1000px;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 40px;
            border-radius: 30px;
            border: 2px solid red;
            backdrop-filter: blur(5px);
            justify-items: center;
        }

        /* LINK Y CARTA DEL PERSONAJE */
        .personaje-link {
            text-decoration: none; /* Quita el subrayado del enlace */
            color: inherit;
            display: block;
            width: 100%;
            max-width: 200px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .personaje-card {
            position: relative; 
            height: 280px; /* Un poco más alta para que luzcan mejor */
            border-radius: 15px;
            overflow: hidden; 
            border: 2px solid red;
            background-color: #000;
        }

        .personaje-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(30%); /* Efecto visual leve */
            transition: filter 0.3s ease;
        }

        .nombre-personaje {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: rgba(255, 0, 0, 0.9);
            color: white;
            text-align: center;
            padding: 8px 0;
            font-size: 1.1em;
            font-weight: bold;
        }

        /* EFECTOS AL PASAR EL RATÓN */
        .personaje-link:hover {
            transform: scale(1.05); /* Se agranda un poco */
        }

        .personaje-link:hover .personaje-card {
            border-color: yellow;
            box-shadow: 0 0 20px rgba(255, 255, 0, 0.5);
        }

        .personaje-link:hover img {
            filter: grayscale(0%); /* Cobra color total al pasar el mouse */
        }

        /* FOOTER */
        footer {
            background-color: rgba(255, 0, 0, 0.9);
            padding: 15px;
            text-align: center;
            border-top: 2px solid yellow;
        }

        /* RESPONSIVE */
        @media (max-width: 600px) {
            .image-grid {
                grid-template-columns: repeat(2, 1fr); /* 2 columnas en móviles */
                gap: 15px;
                padding: 20px;
            }
            .personaje-card {
                height: 200px;
            }
        }
    </style>
</head>
<body>

    <nav>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="h.html">Historia</a></li>
            <li><a href="p.html">Personajes</a></li>
            <li><a href="pa.html">Página de Mods</a></li>
            <li class="nav-logo-right">
                <img src="img/1.png" alt="Logo">
            </li>
        </ul>
    </nav>

    <main class="main-container">
        <section class="image-grid">
            
            <!-- Personaje 1 -->
            <a href="c.html" class="personaje-link">
                <div class="personaje-card">
                    <img src="img/4.png" alt="Coach">
                    <div class="nombre-personaje">Coach</div>
                </div>
            </a>

            <!-- Personaje 2 -->
            <a href="e.html" class="personaje-link">
                <div class="personaje-card">
                    <img src="img/5.png" alt="Ellis">
                    <div class="nombre-personaje">Ellis</div>
                </div>
            </a>

            <!-- Personaje 3 -->
            <a href="n.html" class="personaje-link">
                <div class="personaje-card">
                    <img src="img/6.png" alt="Nick">
                    <div class="nombre-personaje">Nick</div>
                </div>
            </a>

            <!-- Personaje 4 -->
            <a href="r.html" class="personaje-link">
                <div class="personaje-card">
                    <img src="img/7.png" alt="Rochelle">
                    <div class="nombre-personaje">Rochelle</div>
                </div>
            </a>

        </section>
    </main>

    <footer>
        <p>&copy; Copyright - 2026</p>
    </footer>

</body>
</html>
