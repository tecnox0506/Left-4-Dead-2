<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personajes - Selección</title>
    <style>
        /* CONFIGURACIÓN GENERAL */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            background-image: url('img/2.png'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* NAVEGACIÓN UNIFICADA (IGUAL QUE INICIO E HISTORIA) */
        nav {
            background-color: rgba(255, 0, 0, 0.9);
            border-bottom: 2px solid yellow;
            z-index: 1000;
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .nav-logo-left img, .nav-logo-right img {
            height: 40px;
            width: auto;
            display: block;
        }

        .menu-toggle {
            display: none;
            background-color: transparent;
            color: white;
            border: none;
            padding: 15px 20px;
            font-weight: bold;
            font-size: 1.1em;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
        }

        nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex; 
            align-items: center;
        }

        nav li a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 15px 20px;
            font-weight: bold;
            transition: 0.3s;
        }

        nav li a:hover {
            background-color: yellow;
            color: black;
        }

        /* CONTENEDOR PRINCIPAL */
        .main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        /* CUADRÍCULA DE PERSONAJES */
        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 30px;
            max-width: 1000px;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            padding: 40px;
            border-radius: 30px;
            border: 2px solid red;
            backdrop-filter: blur(8px);
            justify-items: center;
        }

        /* TARJETAS DE PERSONAJES */
        .personaje-link {
            text-decoration: none;
            color: inherit;
            display: block;
            width: 100%;
            max-width: 220px;
            transition: transform 0.3s ease;
        }

        .personaje-card {
            position: relative; 
            height: 300px; 
            border-radius: 15px;
            overflow: hidden; 
            border: 2px solid red;
            background-color: #000;
        }

        .personaje-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(40%);
            transition: 0.4s;
        }

        .nombre-personaje {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: rgba(255, 0, 0, 0.95);
            color: white;
            text-align: center;
            padding: 10px 0;
            font-size: 1.1em;
            font-weight: bold;
            text-transform: uppercase;
        }

        .personaje-link:hover {
            transform: scale(1.05);
        }

        .personaje-link:hover .personaje-card {
            border-color: yellow;
            box-shadow: 0 0 20px rgba(255, 255, 0, 0.4);
        }

        .personaje-link:hover img {
            filter: grayscale(0%);
        }

        /* FOOTER */
        footer {
            background-color: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 20px;
            text-align: center;
            border-top: 2px solid red;
        }

        /* RESPONSIVE MÓVIL */
        @media (max-width: 990px) {
            nav {
                flex-direction: column;
                padding: 0;
            }

            .nav-logo-left, .nav-logo-right {
                display: none;
            }

            .menu-toggle {
                display: block; 
                width: 100%;
            }

            nav ul {
                display: none;
                flex-direction: column; 
                align-items: stretch;
                width: 100%;
                background-color: rgba(180, 0, 0, 1);
            }

            nav ul.show {
                display: flex;
            }

            nav li {
                text-align: center;
            }

            .image-grid {
                grid-template-columns: repeat(2, 1fr); 
                gap: 15px;
                padding: 20px;
                width: 95%;
            }

            .personaje-card {
                height: 220px;
            }
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-logo-left">
            <img src="img/1.png" alt="Tecnoxlight">
        </div>

        <button class="menu-toggle" id="menu-btn">☰ Menú ▼</button>

        <ul id="nav-menu">
            <li><a href="index.html">Inicio</a></li>
            <li><a href="h.html">Historia</a></li>
            <li><a href="p.html">Personajes</a></li>
            <li><a href="pa.html">Página de Mods</a></li>
        </ul>

        <div class="nav-logo-right">
            <img src="img/1.jpg" alt="L4D2">
        </div>
    </nav>

    <main class="main-container">
        <section class="image-grid">
            
            <a href="c.html" class="personaje-link">
                <div class="personaje-card">
                    <img src="img/4.png" alt="Coach">
                    <div class="nombre-personaje">Coach</div>
                </div>
            </a>

            <a href="e.html" class="personaje-link">
                <div class="personaje-card">
                    <img src="img/5.png" alt="Ellis">
                    <div class="nombre-personaje">Ellis</div>
                </div>
            </a>

            <a href="n.html" class="personaje-link">
                <div class="personaje-card">
                    <img src="img/6.png" alt="Nick">
                    <div class="nombre-personaje">Nick</div>
                </div>
            </a>

            <a href="r.html" class="personaje-link">
                <div class="personaje-card">
                    <img src="img/7.png" alt="Rochelle">
                    <div class="nombre-personaje">Rochelle</div>
                </div>
            </a>

        </section>
    </main>

    <footer>
        <p>&copy; Copyright - 2026 | Tecnoxlight</p>
    </footer>

    <script>
        const menuBtn = document.getElementById('menu-btn');
        const navMenu = document.getElementById('nav-menu');

        menuBtn.addEventListener('click', () => {
            navMenu.classList.toggle('show');
            if (navMenu.classList.contains('show')) {
                menuBtn.innerHTML = '✖ Cerrar ▲';
            } else {
                menuBtn.innerHTML = '☰ Menú ▼';
            }
        });
    </script>

</body>
</html>
